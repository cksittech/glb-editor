<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }

    #drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(99, 179, 237, 0.15);
      border: 3px dashed #63b3ed;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      color: #63b3ed;
      font-size: 2rem;
      font-family: sans-serif;
      pointer-events: none;
    }
    #drop-overlay.active { display: flex; }

    #ui {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #open-btn {
      padding: 8px 20px;
      background: #4299e1;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-family: sans-serif;
    }
    #open-btn:hover { background: #3182ce; }
    #filename {
      color: #a0aec0;
      font-size: 13px;
      font-family: sans-serif;
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #uv-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      padding: 8px 14px;
      background: #6b46c1;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-family: sans-serif;
      display: none;
    }
    #uv-btn:hover { background: #553c9a; }

    /* UV panel */
    #uv-panel {
      position: fixed;
      top: 56px;
      left: 16px;
      z-index: 20;
      background: rgba(15, 15, 30, 0.95);
      border: 1px solid #4a5568;
      border-radius: 8px;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 8px;
      font-family: sans-serif;
    }
    #uv-panel-header {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #a0aec0;
      font-size: 12px;
    }
    #uv-mesh-select {
      background: #2d3748;
      color: #e2e8f0;
      border: 1px solid #4a5568;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
      flex: 1;
    }
    #uv-canvas-wrap {
      position: relative;
      width: 256px;
      height: 256px;
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
    }
    #uv-canvas { display: block; width: 256px; height: 256px; }
    #uv-canvas-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      font-family: sans-serif;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      border-radius: 4px;
    }
    #uv-canvas-wrap:hover #uv-canvas-overlay { opacity: 1; }
    #uv-tile-select-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #a0aec0;
      font-size: 12px;
    }
    #uv-tile-select {
      background: #2d3748;
      color: #e2e8f0;
      border: 1px solid #4a5568;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
      flex: 1;
    }
    .uv-action-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .uv-select {
      background: #2d3748;
      color: #e2e8f0;
      border: 1px solid #4a5568;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px;
    }
    .uv-action-btn {
      padding: 5px 10px;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    #uv-dl-btn  { background: #2b6cb0; display: none; }
    #uv-dl-btn:hover  { background: #2c5282; }
    #uv-tex-btn { background: #276749; }
    #uv-tex-btn:hover { background: #1c4532; }
    #uv-close-btn {
      background: none;
      border: none;
      color: #718096;
      font-size: 14px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      margin-left: auto;
    }
    #uv-close-btn:hover { color: #e2e8f0; }
    #uv-info {
      color: #718096;
      font-size: 11px;
      flex: 1;
    }
    #tex-status {
      font-size: 11px;
      color: #68d391;
      min-height: 14px;
    }
    #uv-tile-count {
      font-size: 11px;
      color: #718096;
    }

    #gizmo {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 100px;
      height: 100px;
      z-index: 10;
      pointer-events: none;
    }

    #empty-state {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #4a5568;
      font-family: sans-serif;
      gap: 12px;
      pointer-events: none;
    }
    #empty-state svg { opacity: 0.3; }
    #empty-state p { font-size: 16px; opacity: 0.6; }
    #empty-state small { font-size: 12px; opacity: 0.4; }

    /* ---- スライダー共通 ---- */
    .slider-wrap {
      position: fixed;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: sans-serif;
      font-size: 11px;
      color: #a0aec0;
      user-select: none;
    }

    /* 下部：水平回転 */
    #h-wrap {
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      flex-direction: row;
      width: min(480px, calc(100vw - 160px));
    }
    #h-wrap input[type=range] { flex: 1; }

    /* 右側：垂直回転 */
    #v-wrap {
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      flex-direction: column;
      height: min(320px, calc(100vh - 160px));
    }
    #v-wrap input[type=range] {
      flex: 1;
      writing-mode: vertical-lr;
      direction: rtl;
    }

    /* スライダースタイル */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }
    #h-wrap input[type=range] { height: 6px; }
    #v-wrap input[type=range]  { width: 6px; }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4299e1;
      cursor: pointer;
      border: 2px solid #90cdf4;
    }
    input[type=range]::-webkit-slider-runnable-track {
      background: rgba(99,179,237,0.25);
      border-radius: 4px;
    }

    .slider-label { color: #63b3ed; font-weight: bold; font-size: 11px; }
    .slider-val   { color: #718096; min-width: 36px; text-align: center; font-size: 11px; }
    .reset-btn {
      background: none;
      border: 1px solid #4a5568;
      border-radius: 4px;
      color: #718096;
      font-size: 10px;
      padding: 2px 5px;
      cursor: pointer;
      line-height: 1;
      flex-shrink: 0;
    }
    .reset-btn:hover { border-color: #63b3ed; color: #63b3ed; }

    #cam-reset-all {
      position: fixed;
      bottom: 48px;
      right: 12px;
      background: rgba(26,26,46,0.85);
      border: 1px solid #4a5568;
      border-radius: 6px;
      color: #718096;
      font-size: 16px;
      width: 30px;
      height: 30px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    #cam-reset-all:hover { border-color: #63b3ed; color: #63b3ed; }
  </style>
</head>
<body>

<div id="drop-overlay">GLBファイルをドロップ</div>

<div id="ui">
  <button id="open-btn">ファイルを開く</button>
  <span id="filename"></span>
</div>

<button id="uv-btn">UV Export</button>

<!-- UV展開パネル -->
<div id="uv-panel">
  <div id="uv-panel-header">
    <span>UV Map</span>
    <select id="uv-mesh-select"></select>

  <div id="uv-tile-select-wrap">

  <div id="uv-canvas-wrap">

  </div>
  <div class="uv-action-row">
    <button id="uv-dl-btn" class="uv-action-btn">UV ガイド保存（タイル別）</button>

</div>
<input type="file" id="tex-input" accept="image/png,image/jpeg,image/webp" style="display:none">

<canvas id="gizmo" width="100" height="100"></canvas>

<div id="empty-state">
  <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#63b3ed" stroke-width="1">
    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
    <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
    <line x1="12" y1="22.08" x2="12" y2="12"/>
  </svg>
  <p>GLBファイルを開いてください</p>
  <small>ボタンまたはドラッグ＆ドロップ</small>
</div>

<!-- 水平回転バー（下部） -->
<div class="slider-wrap" id="h-wrap">
  <span class="slider-label">H</span>
  <input type="range" id="h-slider" min="-180" max="180" value="0" step="1">
  <span class="slider-val" id="h-val">0°</span>

</div>

<div class="slider-wrap" id="v-wrap">
  <span class="slider-label">V</span>

  <span class="slider-val" id="v-val">0°</span>
  <button class="reset-btn" id="v-reset">↺</button>
</div>

<!-- カメラ全体リセットボタン -->
<button id="cam-reset-all" title="カメラをリセット">⌂</button>

<input type="file" id="file-input" accept=".glb,.gltf" style="display:none">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const emptyState  = document.getElementById('empty-state');
const fileInput   = document.getElementById('file-input');
const filenameEl  = document.getElementById('filename');
const dropOverlay = document.getElementById('drop-overlay');
const uvBtn       = document.getElementById('uv-btn');
const uvPanel     = document.getElementById('uv-panel');
const uvMeshSel   = document.getElementById('uv-mesh-select');
const uvTileSel   = document.getElementById('uv-tile-select');
const uvCanvasWrap= document.getElementById('uv-canvas-wrap');
const uvCanvas    = document.getElementById('uv-canvas');
const uvInfo      = document.getElementById('uv-info');
const uvDlBtn     = document.getElementById('uv-dl-btn');
const uvTexBtn    = document.getElementById('uv-tex-btn');
const uvCloseBtn  = document.getElementById('uv-close-btn');
const texInput    = document.getElementById('tex-input');
const texStatus   = document.getElementById('tex-status');

const hSlider = document.getElementById('h-slider');
const vSlider = document.getElementById('v-slider');
const hVal    = document.getElementById('h-val');
const vVal    = document.getElementById('v-val');

// --- Three.js setup ---
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
Object.assign(renderer.domElement.style, {
  position: 'fixed', inset: '0', width: '100%', height: '100%', zIndex: '0'
});

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
fillLight.position.set(-5, 0, -5);
scene.add(fillLight);

// pivot — グリッドとモデルをまとめて回す
const pivot = new THREE.Group();
scene.add(pivot);
pivot.add(new THREE.GridHelper(10, 20, 0x2d3748, 0x2d3748));

// H: pivotのY軸回転  -180〜+180 deg
// V: カメラ仰角（絶対値）  -90〜+90 deg、初期値 +30
let camRadius = 6;
let camTarget = new THREE.Vector3(0, 0, 0);
let initCamState = null;

function updateCamera() {
  const vDeg = parseFloat(vSlider.value);
  const hDeg = parseFloat(hSlider.value);
  const phi   = vDeg * Math.PI / 180;
  const theta = hDeg * Math.PI / 180;
  // camTarget からの球面オフセット（pivot回転とは独立）
  const offsetX = camRadius * Math.cos(phi) * Math.sin(theta);
  const offsetY = camRadius * Math.sin(phi);
  const offsetZ = camRadius * Math.cos(phi) * Math.cos(theta);
  camera.position.set(
    camTarget.x + offsetX,
    camTarget.y + offsetY,
    camTarget.z + offsetZ
  );
  camera.lookAt(camTarget);
}

function applyRotation() {
  hVal.textContent = Math.round(parseFloat(hSlider.value)) + '°';
  vVal.textContent = Math.round(parseFloat(vSlider.value)) + '°';
  updateCamera();
}

hSlider.addEventListener('input', applyRotation);
vSlider.addEventListener('input', applyRotation);

document.getElementById('h-reset').addEventListener('click', () => { hSlider.value = 0; applyRotation(); });
document.getElementById('v-reset').addEventListener('click', () => { vSlider.value = 30; applyRotation(); });
document.getElementById('cam-reset-all').addEventListener('click', () => {
  if (!initCamState) return;
  camRadius = initCamState.radius;
  camTarget.copy(initCamState.target);
  hSlider.value = initCamState.h;
  vSlider.value = initCamState.v;
  applyRotation();
});

applyRotation();
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  camRadius = Math.max(0.5, Math.min(100, camRadius * (1 + e.deltaY * 0.001)));
  applyRotation();
}, { passive: false });
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

// --- drag to orbit ---
{
  let dragging = false;
  let lastX = 0, lastY = 0;
  let dragSign = 1; // 掴んだ点が手前なら+1、奥なら-1

  const _raycaster = new THREE.Raycaster();
  const _ndc = new THREE.Vector2();

  renderer.domElement.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    if (e.target !== renderer.domElement) return;
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    renderer.domElement.setPointerCapture(e.pointerId);

    // 掴んだ点をレイキャストして手前/奥を判定
    const rect = renderer.domElement.getBoundingClientRect();
    _ndc.set(
      ((e.clientX - rect.left) / rect.width)  * 2 - 1,
      -((e.clientY - rect.top)  / rect.height) * 2 + 1
    );
    _raycaster.setFromCamera(_ndc, camera);

    // シーン内の全メッシュに対してレイキャスト
    const meshes = [];
    scene.traverse(obj => { if (obj.isMesh) meshes.push(obj); });
    const hits = _raycaster.intersectObjects(meshes, false);

    if (hits.length > 0) {
      // ヒット点をカメラ空間に変換してZ値を見る
      // カメラ空間ではZ負方向が前方なので、カメラからターゲットへのベクトルを使う
      const hitWorld = hits[0].point;
      // ワールド空間でカメラ→ヒット点ベクトルとカメラ→回転中心ベクトルを比較
      const toHit    = hitWorld.clone().sub(camera.position);
      const toTarget = camTarget.clone().sub(camera.position);
      // 正射影: ヒット点がターゲットより奥（ドット積がターゲット距離より大きい）かどうか
      const depthHit    = toHit.dot(toTarget.clone().normalize());
      const depthTarget = toTarget.length();
      dragSign = depthHit >= depthTarget ? 1 : -1;
    } else {
      dragSign = 1; // ヒットなし（背景クリック）はデフォルト
    }
  });

  renderer.domElement.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;

    if (e.shiftKey) {
      // Shift+ドラッグ: カメラ平面に沿ってパン
      const panSpeed = camRadius * 0.001;
      // カメラの右方向・上方向ベクトルを取得
      const right = new THREE.Vector3();
      const up    = new THREE.Vector3();
      camera.getWorldDirection(new THREE.Vector3()); // refresh matrix
      right.setFromMatrixColumn(camera.matrixWorld, 0); // X列 = right
      up.setFromMatrixColumn(camera.matrixWorld, 1);    // Y列 = up
      camTarget.addScaledVector(right, -dx * panSpeed);
      camTarget.addScaledVector(up,     dy * panSpeed);
      updateCamera();
    } else {
      // 水平ドラッグ → H スライダー、手前/奥で符号反転
      const newH = Math.max(-180, Math.min(180, parseFloat(hSlider.value) - dx * 0.4 * dragSign));
      hSlider.value = newH;

      // 垂直ドラッグ → V スライダー (仰角)
      const newV = Math.max(-90, Math.min(90, parseFloat(vSlider.value) + dy * 0.3));
      vSlider.value = newV;

      applyRotation();
    }
  });

  const stopDrag = () => { dragging = false; };
  renderer.domElement.addEventListener('pointerup', stopDrag);
  renderer.domElement.addEventListener('pointercancel', stopDrag);
}

// --- Load GLB ---
let currentModel = null;
const loader = new GLTFLoader();

function loadGLB(arrayBuffer, name) {
  if (currentModel) { pivot.remove(currentModel); currentModel = null; }

  loader.parse(arrayBuffer, '', (gltf) => {
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 2.5 / maxDim;

    model.scale.setScalar(scale);
    model.position.sub(center.multiplyScalar(scale));
    const box2 = new THREE.Box3().setFromObject(model);
    model.position.y -= box2.min.y;

    // 法線なしメッシュはライティングで真っ黒になるため MeshBasicMaterial に切り替え
    model.traverse((obj) => {
      if (!obj.isMesh) return;
      const hasNormal = !!obj.geometry.attributes.normal;
      const hasColor  = !!obj.geometry.attributes.color;
      if (!hasNormal) {
        const oldMat = obj.material;
        const color = (oldMat && oldMat.color) ? oldMat.color : new THREE.Color(1, 1, 1);
        obj.material = new THREE.MeshBasicMaterial({
          color,
          vertexColors: hasColor,
          side: THREE.DoubleSide,
        });
      }
    });

    pivot.add(model);
    currentModel = model;

    const modelH = (box2.max.y - box2.min.y) * scale;
    camRadius = maxDim * scale * 2.5;
    camTarget.set(0, modelH * 0.5, 0);

    // スライダーリセット（V=+30が初期仰角）
    hSlider.value = 0; vSlider.value = 30; applyRotation();

    // 初期カメラ状態を保存
    initCamState = { radius: camRadius, target: camTarget.clone(), h: 0, v: 30 };
    document.getElementById('cam-reset-all').style.display = 'flex';

    emptyState.style.display = 'none';
    filenameEl.textContent = name;

    // UV Export ボタンを有効化
    buildUvMeshList(model);
    uvBtn.style.display = 'block';
    uvPanel.style.display = 'none';
  }, (err) => alert('読み込みエラー: ' + err.message));
}

function handleFile(file) {
  if (!file || (!file.name.endsWith('.glb') && !file.name.endsWith('.gltf')))
    return alert('GLBまたはGLTFファイルを選択してください');
  const reader = new FileReader();
  reader.onload = (e) => loadGLB(e.target.result, file.name);
  reader.readAsArrayBuffer(file);
}

document.getElementById('open-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
document.addEventListener('dragover', (e) => { e.preventDefault(); dropOverlay.classList.add('active'); });
document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) dropOverlay.classList.remove('active'); });
document.addEventListener('drop', (e) => { e.preventDefault(); dropOverlay.classList.remove('active'); handleFile(e.dataTransfer.files[0]); });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Gizmo ---
const gizmoCanvas = document.getElementById('gizmo');
const gCtx = gizmoCanvas.getContext('2d');
const GS = 100, GCX = 50, GCY = 50, GRAD = 36, AXLEN = 42;

function drawGizmo() {
  gCtx.clearRect(0, 0, GS, GS);
  pivot.updateMatrixWorld();
  camera.updateMatrixWorld();
  const pm = pivot.matrixWorld;
  const vm = camera.matrixWorldInverse;

  function proj(lx, ly, lz) {
    const e = pm.elements;
    const wx = e[0]*lx + e[4]*ly + e[8]*lz;
    const wy = e[1]*lx + e[5]*ly + e[9]*lz;
    const wz = e[2]*lx + e[6]*ly + e[10]*lz;
    const v = vm.elements;
    const cx = v[0]*wx + v[4]*wy + v[8]*wz;
    const cy = v[1]*wx + v[5]*wy + v[9]*wz;
    const cz = v[2]*wx + v[6]*wy + v[10]*wz;
    return { x: GCX + cx * AXLEN, y: GCY - cy * AXLEN, cz };
  }

  const axes = [
    { d:[1,0,0], color:'#f56565', neg:'#742a2a', label:'X' },
    { d:[0,1,0], color:'#48bb78', neg:'#276749', label:'Y' },
    { d:[0,0,1], color:'#63b3ed', neg:'#2a4365', label:'Z' },
  ].map(ax => ({
    ...ax,
    p: proj(...ax.d),
    n: proj(-ax.d[0], -ax.d[1], -ax.d[2]),
  })).sort((a, b) => a.p.cz - b.p.cz);

  // 球
  const gr = gCtx.createRadialGradient(GCX-8, GCY-8, 4, GCX, GCY, GRAD);
  gr.addColorStop(0, 'rgba(55,65,90,0.9)');
  gr.addColorStop(1, 'rgba(26,26,46,0.85)');
  gCtx.beginPath(); gCtx.arc(GCX, GCY, GRAD, 0, Math.PI*2);
  gCtx.fillStyle = gr; gCtx.fill();
  gCtx.strokeStyle = 'rgba(99,179,237,0.2)'; gCtx.lineWidth = 1; gCtx.stroke();

  // 負方向
  for (const ax of axes) {
    gCtx.beginPath(); gCtx.moveTo(GCX, GCY); gCtx.lineTo(ax.n.x, ax.n.y);
    gCtx.strokeStyle = ax.neg; gCtx.lineWidth = 2; gCtx.stroke();
  }
  // 正方向＋ラベル
  for (const ax of [...axes].reverse()) {
    gCtx.beginPath(); gCtx.moveTo(GCX, GCY); gCtx.lineTo(ax.p.x, ax.p.y);
    gCtx.strokeStyle = ax.color; gCtx.lineWidth = 2.5; gCtx.stroke();
    gCtx.beginPath(); gCtx.arc(ax.p.x, ax.p.y, 5, 0, Math.PI*2);
    gCtx.fillStyle = ax.color; gCtx.fill();
    gCtx.font = 'bold 10px sans-serif';
    gCtx.fillStyle = '#fff'; gCtx.textAlign = 'center'; gCtx.textBaseline = 'middle';
    gCtx.fillText(ax.label, ax.p.x, ax.p.y);
  }
}

// --- UV Export / Texture Import ---
let uvMeshes = [];  // { name, mesh }

function buildUvMeshList(model) {
  uvMeshes = [];
  uvMeshSel.innerHTML = '';
  model.traverse((obj) => {
    if (!obj.isMesh) return;
    const uv = obj.geometry.attributes.uv || obj.geometry.attributes.uv1;
    if (!uv) return;
    uvMeshes.push({ name: obj.name || `Mesh_${uvMeshes.length}`, mesh: obj });
  });

  if (uvMeshes.length === 0) {
    model.traverse((obj) => {
      if (!obj.isMesh) return;
      uvMeshes.push({ name: obj.name || `Mesh_${uvMeshes.length}`, mesh: obj });
    });
  }

  if (uvMeshes.length > 1) {
    const all = document.createElement('option');
    all.value = 'all'; all.textContent = 'All';
    uvMeshSel.appendChild(all);
  }
  for (let i = 0; i < uvMeshes.length; i++) {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = uvMeshes[i].name;
    uvMeshSel.appendChild(opt);
  }
  if (uvMeshes.length > 1) uvMeshSel.value = 'all';

  texStatus.textContent = '';
  updateTileSelect();
}

function calcUvBounds(entries) {
  let uMin = Infinity, uMax = -Infinity, vMin = Infinity, vMax = -Infinity;
  for (const entry of entries) {
    const uvAttr = entry.mesh.geometry.attributes.uv || entry.mesh.geometry.attributes.uv1;
    if (!uvAttr) continue;
    const arr = uvAttr.array;
    for (let i = 0; i < arr.length; i += 2) {
      if (arr[i]   < uMin) uMin = arr[i];
      if (arr[i]   > uMax) uMax = arr[i];
      if (arr[i+1] < vMin) vMin = arr[i+1];
      if (arr[i+1] > vMax) vMax = arr[i+1];
    }
  }
  uMin = Math.min(uMin, 0); uMax = Math.max(uMax, 1);
  vMin = Math.min(vMin, 0); vMax = Math.max(vMax, 1);
  const pad = 0.03;
  return {
    uMin: uMin - (uMax-uMin)*pad, uMax: uMax + (uMax-uMin)*pad,
    vMin: vMin - (vMax-vMin)*pad, vMax: vMax + (vMax-vMin)*pad,
  };
}

const UV_EXPORT_SIZE = 1024;

// UVが存在するタイル（整数座標）を列挙する
function listUvTiles(entries) {
  const tileSet = new Set();
  for (const entry of entries) {
    const uvAttr = entry.mesh.geometry.attributes.uv || entry.mesh.geometry.attributes.uv1;
    if (!uvAttr) continue;
    const arr = uvAttr.array;
    for (let i = 0; i < arr.length; i += 2) {
      const tu = Math.floor(arr[i]);
      const tv = Math.floor(arr[i + 1]);
      tileSet.add(`${tu},${tv}`);
    }
  }
  return [...tileSet].map(s => { const [tu, tv] = s.split(',').map(Number); return { tu, tv }; })
                     .sort((a, b) => a.tu !== b.tu ? a.tu - b.tu : a.tv - b.tv);
}

// 1タイル分（tu〜tu+1, tv〜tv+1）のUVガイドCanvasを生成して返す
function renderTileGuide(entries, tu, tv) {
  const size = UV_EXPORT_SIZE;
  const oc = document.createElement('canvas');
  oc.width = oc.height = size;
  const ctx = oc.getContext('2d');

  // 白背景
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);

  // UV座標 → Canvas座標（このタイルの範囲を0〜sizeにマップ）
  function toC(u, v) {
    return [(u - tu) * size, (1 - (v - tv)) * size];
  }

  // 枠線
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, size - 2, size - 2);

  // UV三角形（薄グレー線）
  ctx.strokeStyle = 'rgba(0,0,0,0.22)';
  ctx.lineWidth = Math.max(1, size / 2048);

  entries.forEach((entry) => {
    const geo = entry.mesh.geometry;
    const uvAttr = geo.attributes.uv || geo.attributes.uv1;
    if (!uvAttr) return;
    const uvArr = uvAttr.array;
    const index = geo.index;

    function tri(i0, i1, i2) {
      const u0 = uvArr[i0*2], v0 = uvArr[i0*2+1];
      const u1 = uvArr[i1*2], v1 = uvArr[i1*2+1];
      const u2 = uvArr[i2*2], v2 = uvArr[i2*2+1];
      // このタイルに少しでも掛かる三角形のみ描画
      const inTile = (u, v) => u >= tu - 0.001 && u <= tu + 1.001 && v >= tv - 0.001 && v <= tv + 1.001;
      if (!inTile(u0, v0) && !inTile(u1, v1) && !inTile(u2, v2)) return;
      const [x0, y0] = toC(u0, v0);
      const [x1, y1] = toC(u1, v1);
      const [x2, y2] = toC(u2, v2);
      ctx.beginPath();
      ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.closePath(); ctx.stroke();
    }

    if (index) {
      for (let i = 0; i < index.count; i += 3) tri(index.getX(i), index.getX(i+1), index.getX(i+2));
    } else {
      for (let i = 0; i < uvAttr.count; i += 3) tri(i, i+1, i+2);
    }
  });

  return oc;
}

// プレビュー用（暗背景＋カラー線）
function drawUv() {
  const selVal = uvMeshSel.value;
  const entries = selVal === 'all' ? uvMeshes : [uvMeshes[parseInt(selVal) || 0]].filter(Boolean);

  const ctx = uvCanvas.getContext('2d');
  const W = uvCanvas.width, H = uvCanvas.height;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);

  if (!entries.length || !entries.some(e => e.mesh.geometry.attributes.uv || e.mesh.geometry.attributes.uv1)) {
    ctx.fillStyle = '#718096'; ctx.font = `${H/20}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('UV なし', W/2, H/2);
    uvInfo.textContent = ''; return;
  }

  const { uMin, uMax, vMin, vMax } = calcUvBounds(entries);
  const uRange = uMax - uMin, vRange = vMax - vMin;
  function toCanvas(u, v) {
    return [((u - uMin) / uRange) * W, (1 - (v - vMin) / vRange) * H];
  }

  // タイル市松
  for (let tu = Math.floor(uMin); tu < Math.ceil(uMax); tu++) {
    for (let tv = Math.floor(vMin); tv < Math.ceil(vMax); tv++) {
      const [x0, y1] = toCanvas(tu,     tv);
      const [x1, y0] = toCanvas(tu + 1, tv + 1);
      ctx.fillStyle = (tu + tv) % 2 === 0 ? 'rgba(40,40,65,0.6)' : 'rgba(25,25,45,0.6)';
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    }
  }
  // タイル線
  ctx.strokeStyle = 'rgba(99,179,237,0.3)'; ctx.lineWidth = 0.5;
  for (let tu = Math.floor(uMin); tu <= Math.ceil(uMax); tu++) {
    const [x] = toCanvas(tu, 0);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let tv = Math.floor(vMin); tv <= Math.ceil(vMax); tv++) {
    const [, y] = toCanvas(0, tv);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  // 0-1枠強調
  const [ox0, oy1] = toCanvas(0, 0); const [ox1, oy0] = toCanvas(1, 1);
  ctx.strokeStyle = 'rgba(99,179,237,0.85)'; ctx.lineWidth = 1.5;
  ctx.strokeRect(ox0, oy0, ox1 - ox0, oy1 - oy0);

  const meshColors = [
    ['rgba(104,211,145,0.8)', 'rgba(104,211,145,0.06)'],
    ['rgba(246,173,85,0.8)',  'rgba(246,173,85,0.06)'],
    ['rgba(154,117,234,0.8)', 'rgba(154,117,234,0.06)'],
    ['rgba(237,100,100,0.8)', 'rgba(237,100,100,0.06)'],
    ['rgba(99,179,237,0.8)',  'rgba(99,179,237,0.06)'],
  ];

  let totalVerts = 0, totalTris = 0;
  entries.forEach((entry, ei) => {
    const geo = entry.mesh.geometry;
    const uvAttr = geo.attributes.uv || geo.attributes.uv1;
    if (!uvAttr) return;
    const uvArr = uvAttr.array; const index = geo.index;
    const [stroke, fill] = meshColors[ei % meshColors.length];
    ctx.strokeStyle = stroke; ctx.fillStyle = fill; ctx.lineWidth = 0.7;

    function tri(i0, i1, i2) {
      const [x0, y0] = toCanvas(uvArr[i0*2], uvArr[i0*2+1]);
      const [x1, y1] = toCanvas(uvArr[i1*2], uvArr[i1*2+1]);
      const [x2, y2] = toCanvas(uvArr[i2*2], uvArr[i2*2+1]);
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.lineTo(x2,y2);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    if (index) {
      for (let i = 0; i < index.count; i += 3) tri(index.getX(i), index.getX(i+1), index.getX(i+2));
      totalTris += index.count / 3;
    } else {
      for (let i = 0; i < uvAttr.count; i += 3) tri(i, i+1, i+2);
      totalTris += uvAttr.count / 3;
    }
    totalVerts += uvAttr.count;
  });

  uvInfo.textContent = `U[${uMin.toFixed(2)}~${uMax.toFixed(2)}] V[${vMin.toFixed(2)}~${vMax.toFixed(2)}]  ${totalVerts} verts / ${Math.round(totalTris)} tris`;
}

// 指定タイルのUVを持つメッシュを選択エントリから返す
function getMeshesForTile(entries, tu, tv) {
  return entries.filter(({ mesh }) => {
    const uvAttr = mesh.geometry.attributes.uv || mesh.geometry.attributes.uv1;
    if (!uvAttr) return false;
    const arr = uvAttr.array;
    for (let i = 0; i < arr.length; i += 2) {
      const u = arr[i], v = arr[i + 1];
      if (u >= tu - 0.001 && u <= tu + 1.001 && v >= tv - 0.001 && v <= tv + 1.001) return true;
    }
    return false;
  });
}

function makeTexture(imageElement, offsetX, offsetY, repeatX, repeatY) {
  const tex = new THREE.Texture(imageElement);
  tex.colorSpace = THREE.SRGBColorSpace;
  // ClampToEdge: タイル範囲外のUVには端のピクセルを使い、他タイルへの漏れを防ぐ
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.offset.set(offsetX, offsetY);
  tex.repeat.set(repeatX, repeatY);
  tex.needsUpdate = true;
  return tex;
}

function applyMatTex(mesh, tex) {
  const mat = mesh.material;
  if (mat.isMeshBasicMaterial || mat.isMeshStandardMaterial) {
    mat.map = tex;
    mat.vertexColors = false;
    mat.color.set(0xffffff);
    mat.needsUpdate = true;
  } else {
    mesh.material = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
  }
}

// テクスチャ適用
// 単タイル: UV fract(u - tu) → tex.x, fract(v - tv) → tex.y をシェーダーで計算
// All結合PNG: UV fract(u - tu) / N + idx/N → tex.x をシェーダーで計算
// カスタムシェーダーを使うことでメッシュが複数タイルにまたがっていても正確にマッピングできる

function makeUdimShaderMat(imageElement, tileList) {
  // tileList = [{tu, tv, idx}] — 1タイルなら要素1つ、Allならタイル数分
  const N = tileList.length === 1 ? 1 : tileList.reduce((m, t) => Math.max(m, t.idx + 1), 0);
  const isSingle = tileList.length === 1;

  const tex = new THREE.Texture(imageElement);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.needsUpdate = true;

  // タイルリストをシェーダー用uniform配列に変換 (最大16タイル)
  const MAX_TILES = 16;
  const tuArr = new Float32Array(MAX_TILES);
  const tvArr = new Float32Array(MAX_TILES);
  const idxArr = new Float32Array(MAX_TILES);
  tileList.forEach((t, i) => { tuArr[i] = t.tu; tvArr[i] = t.tv; idxArr[i] = t.idx; });

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTex:      { value: tex },
      uN:        { value: isSingle ? 1.0 : tileList.length },
      uNumTiles: { value: tileList.length },
      uTu:       { value: tuArr },
      uTv:       { value: tvArr },
      uIdx:      { value: idxArr },
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D uTex;
      uniform float uN;
      uniform int uNumTiles;
      uniform float uTu[16];
      uniform float uTv[16];
      uniform float uIdx[16];
      varying vec2 vUv;
      void main() {
        float u = vUv.x;
        float v = vUv.y;
        int tu = int(floor(u));
        int tv = int(floor(v));
        // このUVが属するタイルを検索
        float texX = -1.0;
        float texY = -1.0;
        for (int i = 0; i < 16; i++) {
          if (i >= uNumTiles) break;
          if (int(uTu[i]) == tu && int(uTv[i]) == tv) {
            float localU = u - uTu[i];          // 0~1
            float localV = v - uTv[i];          // 0~1
            texX = (uIdx[i] + localU) / uN;    // All: 列位置へ, 単タイル: そのまま
            texY = localV;
            break;
          }
        }
        if (texX < 0.0) {
          gl_FragColor = vec4(0.0, 0.0, 0.0, 0.0); // タイル外は透明
        } else {
          gl_FragColor = texture2D(uTex, vec2(texX, texY));
        }
      }
    `,
    side: THREE.DoubleSide,
    transparent: true,
  });
  return mat;
}

function applyTexture(imageElement) {
  const tile = getSelectedTile();
  const entries = getSelectedEntries();

  if (tile) {
    // 単タイル: そのタイルのUVのみマッピング
    const { tu, tv } = tile;
    const mat = makeUdimShaderMat(imageElement, [{ tu, tv, idx: 0 }]);
    getMeshesForTile(entries, tu, tv).forEach(({ mesh }) => { mesh.material = mat; });
    texStatus.textContent = `適用済み ✓ (UDIM ${1001 + tu + tv * 10})`;
  } else {
    // All結合PNG: 全タイルを1つのシェーダーでマッピング
    const allTiles = listUvTiles(entries);
    const tileList = allTiles.map(({ tu, tv }, idx) => ({ tu, tv, idx }));
    const mat = makeUdimShaderMat(imageElement, tileList);
    // 全メッシュに同一マテリアルを適用（シェーダー内でタイルを振り分ける）
    entries.forEach(({ mesh }) => { mesh.material = mat; });
    texStatus.textContent = `適用済み ✓ (全${allTiles.length}タイル)`;
  }
}

function getSelectedEntries() {
  const selVal = uvMeshSel.value;
  return selVal === 'all' ? uvMeshes : [uvMeshes[parseInt(selVal) || 0]].filter(Boolean);
}

function updateTileSelect() {
  const entries = getSelectedEntries();
  const tiles = listUvTiles(entries);
  const el = document.getElementById('uv-tile-count');
  if (el) el.textContent = `${tiles.length} タイル`;

  const prev = uvTileSel.value;
  uvTileSel.innerHTML = '';

  if (tiles.length > 1) {
    const allOpt = document.createElement('option');
    allOpt.value = 'all';
    allOpt.textContent = `All  (${tiles.length} タイル)`;
    uvTileSel.appendChild(allOpt);
  }

  tiles.forEach(({ tu, tv }) => {
    const udim = 1001 + tu + tv * 10;
    const opt = document.createElement('option');
    opt.value = `${tu},${tv}`;
    opt.textContent = `UDIM ${udim}  (u${tu} v${tv})`;
    uvTileSel.appendChild(opt);
  });

  // 前の選択を復元、なければ先頭
  if ([...uvTileSel.options].some(o => o.value === prev)) uvTileSel.value = prev;

  const ovl = document.getElementById('uv-canvas-overlay');
  if (ovl) ovl.textContent = uvTileSel.value === 'all' ? 'クリックで全タイルDL' : 'クリックでダウンロード';

  drawTilePreview();
}

// 'all' のとき null を返す（全タイル扱い）、それ以外は {tu, tv}
function getSelectedTile() {
  const val = uvTileSel.value;
  if (!val || val === 'all') return null;
  const [tu, tv] = val.split(',').map(Number);
  return { tu, tv };
}

function drawTilePreview() {
  const tile = getSelectedTile();
  const entries = getSelectedEntries();
  const ctx = uvCanvas.getContext('2d');
  const W = uvCanvas.width, H = uvCanvas.height;
  ctx.clearRect(0, 0, W, H);

  const meshColors = [
    'rgba(104,211,145,0.8)',
    'rgba(246,173,85,0.8)',
    'rgba(154,117,234,0.8)',
    'rgba(237,100,100,0.8)',
    'rgba(99,179,237,0.8)',
  ];

  if (!tile) {
    // All: 全タイルをUV座標系全体にフィットして表示
    const { uMin, uMax, vMin, vMax } = calcUvBounds(entries);
    const uRange = uMax - uMin, vRange = vMax - vMin;
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    function toCA(u, v) {
      return [((u - uMin) / uRange) * W, (1 - (v - vMin) / vRange) * H];
    }

    const tiles = listUvTiles(entries);
    // タイル背景
    tiles.forEach(({ tu, tv }, i) => {
      const [x0, y1] = toCA(tu,     tv);
      const [x1, y0] = toCA(tu + 1, tv + 1);
      ctx.fillStyle = i % 2 === 0 ? 'rgba(40,40,65,0.6)' : 'rgba(25,25,45,0.6)';
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      // UDIM番号
      const udim = 1001 + tu + tv * 10;
      ctx.fillStyle = 'rgba(99,179,237,0.5)';
      ctx.font = `${Math.max(10, (x1-x0)*0.15)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(udim, (x0+x1)/2, (y0+y1)/2);
    });
    // タイル区切り線
    ctx.strokeStyle = 'rgba(99,179,237,0.4)'; ctx.lineWidth = 0.5;
    for (let tu = Math.floor(uMin); tu <= Math.ceil(uMax); tu++) {
      const [x] = toCA(tu, 0);
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let tv = Math.floor(vMin); tv <= Math.ceil(vMax); tv++) {
      const [, y] = toCA(0, tv);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    // UV線
    entries.forEach((entry, ei) => {
      const geo = entry.mesh.geometry;
      const uvAttr = geo.attributes.uv || geo.attributes.uv1;
      if (!uvAttr) return;
      const uvArr = uvAttr.array; const index = geo.index;
      ctx.strokeStyle = meshColors[ei % meshColors.length]; ctx.lineWidth = 0.6;
      function tri(i0, i1, i2) {
        const [x0,y0]=toCA(uvArr[i0*2],uvArr[i0*2+1]);
        const [x1,y1]=toCA(uvArr[i1*2],uvArr[i1*2+1]);
        const [x2,y2]=toCA(uvArr[i2*2],uvArr[i2*2+1]);
        ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.lineTo(x2,y2); ctx.closePath(); ctx.stroke();
      }
      if (index) { for (let i=0;i<index.count;i+=3) tri(index.getX(i),index.getX(i+1),index.getX(i+2)); }
      else { for (let i=0;i<uvAttr.count;i+=3) tri(i,i+1,i+2); }
    });

    uvInfo.textContent = `U[${uMin.toFixed(2)}~${uMax.toFixed(2)}] V[${vMin.toFixed(2)}~${vMax.toFixed(2)}]  全${tiles.length}タイル`;
    return;
  }

  // 単タイル表示
  const { tu, tv } = tile;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  function toC(u, v) {
    return [(u - tu) * W, (1 - (v - tv)) * H];
  }

  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  entries.forEach((entry, ei) => {
    const geo = entry.mesh.geometry;
    const uvAttr = geo.attributes.uv || geo.attributes.uv1;
    if (!uvAttr) return;
    const uvArr = uvAttr.array;
    const index = geo.index;
    ctx.strokeStyle = meshColors[ei % meshColors.length];
    ctx.lineWidth = 0.7;

    function tri(i0, i1, i2) {
      const u0 = uvArr[i0*2], v0 = uvArr[i0*2+1];
      const u1 = uvArr[i1*2], v1 = uvArr[i1*2+1];
      const u2 = uvArr[i2*2], v2 = uvArr[i2*2+1];
      const inTile = (u, v) => u >= tu - 0.001 && u <= tu + 1.001 && v >= tv - 0.001 && v <= tv + 1.001;
      if (!inTile(u0, v0) && !inTile(u1, v1) && !inTile(u2, v2)) return;
      const [x0, y0] = toC(u0, v0);
      const [x1, y1] = toC(u1, v1);
      const [x2, y2] = toC(u2, v2);
      ctx.beginPath();
      ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.closePath(); ctx.stroke();
    }

    if (index) {
      for (let i = 0; i < index.count; i += 3) tri(index.getX(i), index.getX(i+1), index.getX(i+2));
    } else {
      for (let i = 0; i < uvAttr.count; i += 3) tri(i, i+1, i+2);
    }
  });

  const udim = 1001 + tu + tv * 10;
  uvInfo.textContent = `UDIM ${udim}  U[${tu}~${tu+1}] V[${tv}~${tv+1}]`;
}

uvBtn.addEventListener('click', () => {
  uvPanel.style.display = uvPanel.style.display === 'flex' ? 'none' : 'flex';
  if (uvPanel.style.display === 'flex') { updateTileSelect(); }
});
uvCloseBtn.addEventListener('click', () => { uvPanel.style.display = 'none'; });
uvMeshSel.addEventListener('change', () => { updateTileSelect(); });
uvTileSel.addEventListener('change', () => {
  drawTilePreview();
  const ovl = document.getElementById('uv-canvas-overlay');
  if (ovl) ovl.textContent = uvTileSel.value === 'all' ? `クリックで全タイルDL` : 'クリックでダウンロード';
});

// タイルのUVデータをJSON形式で生成
function buildTileJson(entries, tu, tv) {
  const meshes = [];
  entries.forEach((entry) => {
    const geo = entry.mesh.geometry;
    const uvAttr = geo.attributes.uv || geo.attributes.uv1;
    if (!uvAttr) return;
    const uvArr = uvAttr.array;
    const index = geo.index;
    const inTile = (u, v) => u >= tu - 0.001 && u <= tu + 1.001 && v >= tv - 0.001 && v <= tv + 1.001;
    const triangles = [];

    function collectTri(i0, i1, i2) {
      const u0 = uvArr[i0*2], v0 = uvArr[i0*2+1];
      const u1 = uvArr[i1*2], v1 = uvArr[i1*2+1];
      const u2 = uvArr[i2*2], v2 = uvArr[i2*2+1];
      if (!inTile(u0, v0) && !inTile(u1, v1) && !inTile(u2, v2)) return;
      const r = (n) => Math.round(n * 100000) / 100000;
      triangles.push({
        v0: [r(u0 - tu), r(v0 - tv)],
        v1: [r(u1 - tu), r(v1 - tv)],
        v2: [r(u2 - tu), r(v2 - tv)],
      });
    }

    if (index) {
      for (let i = 0; i < index.count; i += 3) collectTri(index.getX(i), index.getX(i+1), index.getX(i+2));
    } else {
      for (let i = 0; i < uvAttr.count; i += 3) collectTri(i, i+1, i+2);
    }

    if (triangles.length > 0) meshes.push({ name: entry.name || entry.mesh.name || 'mesh', triangles });
  });
  return { tile: { tu, tv, udim: 1001 + tu + tv * 10 }, meshes };
}

function downloadJson(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.download = filename;
  a.href = URL.createObjectURL(blob);
  a.click();
  URL.revokeObjectURL(a.href);
}

// キャンバスクリックで選択タイルをダウンロード（All選択時は全タイル順次DL）
uvCanvasWrap.addEventListener('click', () => {
  const tile = getSelectedTile();
  const entries = getSelectedEntries();
  const selVal = uvMeshSel.value;
  const label = selVal === 'all' ? 'all'
    : (uvMeshes[parseInt(selVal)] || { name: 'uv' }).name.replace(/[^a-zA-Z0-9_\-]/g, '_');

  if (!tile) {
    // All: 全タイルを横並びで1枚のPNGとして出力 + 全タイル分JSONも出力
    const tiles = listUvTiles(entries);
    if (tiles.length === 0) { alert('UVデータがありません'); return; }
    const tileSize = UV_EXPORT_SIZE;
    const combined = document.createElement('canvas');
    combined.width  = tileSize * tiles.length;
    combined.height = tileSize;
    const combinedCtx = combined.getContext('2d');
    const allJson = [];
    tiles.forEach(({ tu, tv }, idx) => {
      const tileCanvas = renderTileGuide(entries, tu, tv);
      combinedCtx.drawImage(tileCanvas, tileSize * idx, 0);
      allJson.push(buildTileJson(entries, tu, tv));
    });
    const a = document.createElement('a');
    a.download = `uv_${label}_all_${tiles.length}tiles.png`;
    a.href = combined.toDataURL('image/png');
    a.click();
    setTimeout(() => {
      downloadJson(allJson, `uv_${label}_all_${tiles.length}tiles.json`);
    }, 200);
    texStatus.textContent = `保存: 全${tiles.length}タイル結合`;
    setTimeout(() => { texStatus.textContent = ''; }, 1500);
    return;
  }

  // 単タイル
  const { tu, tv } = tile;
  const canvas = renderTileGuide(entries, tu, tv);
  const udim = 1001 + tu + tv * 10;
  const a = document.createElement('a');
  a.download = `uv_${label}_${udim}_u${tu}v${tv}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
  setTimeout(() => {
    downloadJson(buildTileJson(entries, tu, tv), `uv_${label}_${udim}_u${tu}v${tv}.json`);
  }, 200);
  texStatus.textContent = `保存: UDIM ${udim}`;
  setTimeout(() => { texStatus.textContent = ''; }, 1500);
});

uvTexBtn.addEventListener('click', () => { texInput.value = ''; texInput.click(); });
texInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => { applyTexture(img); URL.revokeObjectURL(url); };
  img.src = url;
});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
  drawGizmo();
}
animate();
</script>
